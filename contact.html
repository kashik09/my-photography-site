<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" href="/images/favicon_io/favicon.ico" type="image/x-icon">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">

  <!-- PNG Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">

  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="nav-bar">
        <div class="logo">
          <img src="images/logo/secondary-logo-nav-bar (1).png" alt="The Kashi Kweyu Photography Logo" title="Kashi Kweyu Photography">
        </div>
        <div class="nav">
          <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact Me</a></li>
          </ul>
        </div>
      </div>
    </nav>      
  </header>
  <main>
    <section class="contact">
        <h2>Contact Me</h2>
        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email" pattern="[a-z0-9._%+-]+@(gmail|yahoo|outlook|hotmail|icloud)\.(com|net|org)"
            required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="10" placeholder="Your Message" required></textarea>
          </div>
          <button type="submit" title="Click to send your message">Send Message</button>
        </form>
      </section>      
  </main>
  <footer>
    <div class="footer">
      <div class="copyright">
        <p>&copy; 2025 Kashi Kweyu Photography | Photos sourced from <a href="https://pexels.com" target="_blank" rel="noopener noreferrer">Pexels</a></p>
      </div>
      <div class="logo">
        <img src="images/logo/secondary-logo-nav-bar_1 (1).png" alt="The Kashi Kweyu Photography Logo">
      </div>
    </div>
  </footer>
</body>
</html>
